name: "Setup android signing config"
description: "Writes credentials from environment into files"
inputs:
  release-keystore:
    description: 'Encrypted keystore contents'
    required: true
  release-keystore-passphrase:
    description: 'Keystore encryption passphrase'
    required: true
  keystore-key-alias:
    description: 'key.properties keyAlias'
    required: true
  keystore-key-password:
    description: 'key.properties keyPassword'
    required: true
  keystore-store-password:
    description: 'key.properties storePassword'
    required: true
  output-directory:
    description: The directory of the project
    required: true
    default: ${{ github.workspace }}/android
    
runs:
  using: "composite"
  steps:
    - name: Validate and decrypt signing credentials
      run: |
        set -Eeuo pipefail
        umask 077

        missing_secrets=false
        for secret_name in RELEASE_KEYSTORE RELEASE_KEYSTORE_PASSPHRASE KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD KEYSTORE_STORE_PASSWORD; do
          if [[ -z "${!secret_name}" ]]; then
            printf '::error::Missing repository Actions secret: %s\n' "$secret_name"
            missing_secrets=true
          fi
        done
        if [[ "$missing_secrets" == true ]]; then
          exit 1
        fi

        temporary_directory=$(mktemp -d)
        trap 'rm -rf "$temporary_directory"' EXIT
        printf '%s\n' "$RELEASE_KEYSTORE" > "$temporary_directory/keystore.asc"
        if ! gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
          --output "$temporary_directory/release-keystore.jks" \
          --decrypt "$temporary_directory/keystore.asc" <<< "$RELEASE_KEYSTORE_PASSPHRASE"; then
          printf '::error::Cannot decrypt RELEASE_KEYSTORE. Set it to the complete ASCII-armored GPG-encrypted keystore and check RELEASE_KEYSTORE_PASSPHRASE.\n'
          exit 1
        fi

        mkdir -p "$OUTPUT_DIRECTORY/app"
        mv "$temporary_directory/release-keystore.jks" "$OUTPUT_DIRECTORY/app/release-keystore.jks"
        printf 'storeFile=release-keystore.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
          "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" \
          > "$OUTPUT_DIRECTORY/key.properties"
      shell: bash
      env:
        RELEASE_KEYSTORE: ${{ inputs.release-keystore }}
        RELEASE_KEYSTORE_PASSPHRASE: ${{ inputs.release-keystore-passphrase }}
        KEYSTORE_KEY_ALIAS: ${{ inputs.keystore-key-alias }}
        KEYSTORE_KEY_PASSWORD: ${{ inputs.keystore-key-password }}
        KEYSTORE_STORE_PASSWORD: ${{ inputs.keystore-store-password }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}